<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the layout reach the physical edges, which on a notched phone in landscape is roughly 88px that was previously letterboxed away. It is only safe because every edge-anchored surface pairs its own padding with the matching inset: the fixed skip link and floating toast in app-styles.ts, the sticky top bar and sidebar in `sidebar`, <main>'s horizontal padding, and the activity dialog's sticky footer. `env()` resolves to 0px where there is no inset, so each of those is written `max(<the old value>,env(...))` and is byte-identical on every device without a cutout. Adding `cover` without all five is what puts content under the notch — they belong together. Never add `maximum-scale` or `user-scalable=no`: pinch-zoom is the only text-scaling lever this app offers on mobile Safari, and suppressing it hides the symptom of an undersized control instead of fixing it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PR Desk</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
