name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  web:
    name: Web tests and build
    runs-on: yldm-backend-runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          version: 0.3.1
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: bun run test:web
      - run: bun run build
  api:
    name: API race and PostgreSQL tests
    runs-on: yldm-backend-runners
    timeout-minutes: 20
    env:
      CONTAINER: pr-desk-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          # Persistent runners already keep their Go caches on disk.
          cache: false
      - run: scripts/ci-postgres.sh start
      - name: Vet and test with race detection
        working-directory: apps/api
        run: |
          go vet ./...
          go test -race ./... -count=1
      - name: Remove test database
        if: always()
        run: scripts/ci-postgres.sh stop
  containers:
    name: Build embedded application image
    runs-on: yldm-backend-runners
    timeout-minutes: 25
    env:
      IMAGE: pr-desk-ci:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: |
          mapfile -t proxy_args < <(scripts/runner-proxy.sh build-args)
          docker build "${proxy_args[@]}" -f apps/api/Dockerfile -t "$IMAGE" .
      - name: Remove test image
        if: always()
        run: docker image rm "$IMAGE" 2>/dev/null || true
