name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  web:
    name: Web tests and build
    runs-on: yldm-backend-runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:web
      - run: bun run build
  api:
    name: API race and PostgreSQL tests
    runs-on: yldm-backend-runners
    timeout-minutes: 20
    env:
      CONTAINER: pr-desk-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: scripts/ci-postgres.sh start
      - name: Vet and test with race detection
        working-directory: apps/api
        run: |
          go vet ./...
          go test -race ./... -count=1
      - name: Remove test database
        if: always()
        run: scripts/ci-postgres.sh stop
  containers:
    name: Build ${{ matrix.app }} image
    runs-on: yldm-backend-runners
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    env:
      APP: ${{ matrix.app }}
      IMAGE: pr-desk-ci-${{ matrix.app }}:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: |
          mapfile -t proxy_args < <(scripts/runner-proxy.sh build-args)
          docker build "${proxy_args[@]}" -f "apps/$APP/Dockerfile" -t "$IMAGE" .
      - name: Remove test image
        if: always()
        run: docker image rm "$IMAGE" 2>/dev/null || true
