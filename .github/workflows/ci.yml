name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: 0.3.1
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - run: bun audit
      - run: vp check
      - run: bun run test:web
      - run: bun run build
  api:
    name: API race and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTAINER: pr-desk-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          # Avoid sharing mutable caches between pull requests.
          cache: false
      - run: scripts/ci-postgres.sh start
      - name: Vet and test with race detection
        working-directory: apps/api
        run: |
          go vet ./...
          go test -race ./... -count=1
      - name: Check reachable Go vulnerabilities
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Remove test database
        if: always()
        run: scripts/ci-postgres.sh stop
  containers:
    name: Build embedded application image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: pr-desk-ci:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image
        run: |
          mapfile -t proxy_args < <(scripts/runner-proxy.sh build-args)
          docker build "${proxy_args[@]}" -f apps/api/Dockerfile -t "$IMAGE" .
      - name: Remove test image
        if: always()
        run: docker image rm "$IMAGE" 2>/dev/null || true
  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --no-banner --log-opts=--all .
