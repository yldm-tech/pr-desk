name: Release
# Like glean, publish only the exact main commit whose CI completed successfully.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: yldm-backend-runners
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: 0.1.${{ github.event.workflow_run.run_number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Reserve immutable release tag
        shell: bash
        run: |
          # CI run numbers are monotonic; retries reuse the same version and SHA.
          tag="v$VERSION"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            [ "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" ] || exit 1
          else
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both tested images
        shell: bash
        run: |
          mapfile -t proxy_args < <(scripts/runner-proxy.sh build-args)
          for app in api web; do
            image="ghcr.io/${GH_REPO}-${app}"
            docker build "${proxy_args[@]}" -f "apps/$app/Dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/$GH_REPO" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              -t "$image:$VERSION" -t "$image:sha-$RELEASE_SHA" .
          done
      - name: Push images and publish release
        shell: bash
        run: |
          for app in api web; do
            image="ghcr.io/${GH_REPO}-${app}"
            docker push "$image:$VERSION"
            docker push "$image:sha-$RELEASE_SHA"
          done
          # An older CI run finishing late must not roll the latest images back.
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$RELEASE_SHA" ]; then
            for app in api web; do
              image="ghcr.io/${GH_REPO}-${app}"
              docker tag "$image:$VERSION" "$image:latest"
              docker push "$image:latest"
            done
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes --latest=false
          fi
          {
            echo "## Published $VERSION"
            echo "Source: $RELEASE_SHA"
            echo "- ghcr.io/${GH_REPO}-api:$VERSION"
            echo "- ghcr.io/${GH_REPO}-web:$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove local release images
        if: always()
        shell: bash
        run: |
          for app in api web; do
            image="ghcr.io/${GH_REPO}-${app}"
            docker image rm "$image:$VERSION" "$image:sha-$RELEASE_SHA" "$image:latest" 2>/dev/null || true
          done
